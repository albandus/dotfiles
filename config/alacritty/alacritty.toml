[env]
TERM = "xterm-256color"

[font]
size = 10.0

[[keyboard.bindings]]
chars = "\u00021"
key = "Key1"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00022"
key = "Key2"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00023"
key = "Key3"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00024"
key = "Key4"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00025"
key = "Key5"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00026"
key = "Key6"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00027"
key = "Key7"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00028"
key = "Key8"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00029"
key = "Key9"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u0002%"
key = "D"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u0002\""
key = "D"
mods = "Shift|Alt"

[[keyboard.bindings]]
chars = "\u0002z"
key = "Return"
mods = "Shift|Alt"

[[keyboard.bindings]]
chars = "\u0002c"
key = "T"
mods = "Alt"

# \ and line break, for claude code
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\\\n"

# Send ctrl+b r
# Tmux shortcut / Set window title to current dir
[[keyboard.bindings]]
chars = "\u0002r"
key = "R"
mods = "Alt"

# Send ctrl+b e
# Tmux shortcut: set window title, prefill, but editable
[[keyboard.bindings]]
chars = "\u0002e"
key = "R"
mods = "Shift|Alt"

# Find keycodes:
# showkey -a / showkey --scancodes
# Save alacritty config file with wrong key names to get a list (alacritty auto
# parse config and display error)

